services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: abacus-experts:latest
    container_name: abacus-experts
    restart: unless-stopped
    ports:
      - "3020:3020"
    environment:
      NODE_ENV: production
      PORT: "3020"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3020/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
